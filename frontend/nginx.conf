# Same-origin API for the static bundle: the app calls relative /api and /ws
# (Vite's dev proxy does this in `npm run dev`), so forward them to the backend.

# Docker's DNS, re-resolved every 10 s: a recreated backend gets a new IP, and
# the image still starts when no `backend` host exists yet.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  set $backend http://backend:8090;

  # Keep the browser's Host so Spring sees a same-origin request (otherwise
  # CORS rejects any origin but localhost:5173, e.g. a kitchen tablet on the LAN).
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass $backend;
  }

  # SockJS: /ws/info plus /ws/<server>/<session>/<transport>.
  location /ws/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # No STOMP heartbeats: a quiet kitchen must not be cut off after nginx's default 60 s.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Bare /api is an API path, not an SPA route.
  location = /api {
    return 404;
  }

  # SPA fallback: any unknown path returns index.html.
  location / {
    try_files $uri /index.html;
  }
}
